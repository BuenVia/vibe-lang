server:
  # Render (and most PaaS) inject PORT; locally it defaults to 8080.
  port: ${PORT:8080}

spring:
  application:
    name: vibe-lang-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vibelang}
    username: ${DB_USERNAME:vibelang}
    password: ${DB_PASSWORD:vibelang}
    hikari:
      # Keep small: Supabase's free connection pooler has a low connection limit.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration)
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
  flyway:
    enabled: true
    # Flyway creates this schema if it does not exist and migrates into it.
    schemas: ${DB_SCHEMA:public}

app:
  cors:
    # Comma-separated list of origins allowed to call the API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
